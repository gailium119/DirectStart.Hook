; DirectStart.ini
;
; Function address configuration for the Windows 8.1 start-menu winmm proxy.
;
; Keys are public PDB symbol names (class-qualified). Values can be:
;   0x12345          RVA: module base + 0x12345 (preferred)
;   module+0x12345   same as above
;   va+0x7FFB1234    absolute 64-bit virtual address
;
; Normally these addresses are resolved automatically from the Microsoft symbol
; server and written back here. Edit them only for offline / unsupported builds.
; Delete [meta] (or the whole file) to force a refresh after a Windows update.

[meta]
; explorer=<build fingerprint>
; twinui=<build fingerprint>
; dui70=<build fingerprint>

[explorer]
; CPearl::BuildStartMenu=0x12345
; CPearl::DisplayStartMenu=0x12345
; CPearl::ShowStartPage=0x12345
; CTray::v_WndProc=0x12345
; DesktopV2_Create=0x12345
; DesktopV2_Build=0x12345

[twinui]
; CImmersiveLauncher::ShowStartView=0x12345
; CImmersiveSystemTile::_Initialize=0x12345
; CSystemTileElement::AdjustNameBaselineLinespacing=0x12345
; CLiveTileDataProvider::SubscribeToTiles=0x12345

[dui70]
; DirectUI::DUIXmlParser::CreateElement=0x12345
; DirectUI::Element::SetClass=0x12345
; DirectUI::Element::GetChildren=0x12345
